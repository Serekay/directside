name: DirectSide
options:
  bundleIdPrefix: com.directside
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
targets:
  DirectSide:
    type: application
    platform: iOS
    sources:
      - DirectSide
      - path: Resources/MacAnisetteRuntime
        type: folder
        buildPhase: resources
      - path: ../assets/apple_root.cer
        buildPhase: resources
      - path: ../licenses/Unicorn-GPL-2.0.txt
        buildPhase: resources
      - path: ../licenses/Unicorn-LGPL-2.1.txt
        buildPhase: resources
      - path: ../vendor/mac-adi-rust/LICENSE
        buildPhase: resources
      - path: ../THIRD_PARTY.md
        buildPhase: resources
    info:
      path: DirectSide/Info.plist
      properties:
        CFBundleDisplayName: DirectSide
        NSCameraUsageDescription: QR-Codes zum Hinzufügen deiner App-Quellen scannen.
        NSLocalNetworkUsageDescription: Apps über LocalDevVPN auf deinem eigenen Gerät installieren.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSBonjourServices: ['_remotepairing._tcp']
        LSApplicationQueriesSchemes: [livecontainer, localdevvpn]
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS application
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.directside.ipa]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.directside.ipa
            UTTypeDescription: iOS application archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [ipa]
        CFBundleURLTypes:
          - CFBundleURLName: DirectSide Sources
            CFBundleURLSchemes: [directside]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.directside.app
        PRODUCT_NAME: DirectSide
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '11'
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: DirectSide
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_OBJC_BRIDGING_HEADER: DirectSide/Bridge.h
        LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(PROJECT_DIR)/../target/aarch64-apple-ios/release', '$(PROJECT_DIR)/../build/mac-auth/rust/ios/aarch64-apple-ios/release']
        OTHER_LDFLAGS: ['$(inherited)', '-ldirectside_core', '-ldirectside_mac_adi', '-framework', Security, '-framework', SystemConfiguration, '-framework', CoreFoundation, '-liconv', '-lresolv']
  DirectSideAnisetteProbe:
    type: tool
    platform: macOS
    deploymentTarget: '13.0'
    sources:
      - DirectSide/LocalAnisette.swift
      - Tests/AnisetteProbe.swift
      - path: ../assets/apple_root.cer
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: DirectSideAnisetteProbe
        ONLY_ACTIVE_ARCH: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_OBJC_BRIDGING_HEADER: DirectSide/MacADI.h
        LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(PROJECT_DIR)/../build/mac-auth/rust/mac/release']
        OTHER_LDFLAGS: ['$(inherited)', '-ldirectside_mac_adi', '-framework', Security]
schemes:
  DirectSide:
    build:
      targets:
        DirectSide: all
  DirectSideAnisetteProbe:
    build:
      targets:
        DirectSideAnisetteProbe: all
