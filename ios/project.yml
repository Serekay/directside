name: DirectSide
options:
  bundleIdPrefix: com.directside
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
packages:
  AnisetteKit:
    url: https://github.com/mahee96/AnisetteKit.git
    revision: db8b41022697b6c19be8a5f01a1ce834145a2a26
targets:
  DirectSide:
    type: application
    platform: iOS
    sources:
      - DirectSide
      - path: Resources/AnisetteRuntime
        type: folder
        buildPhase: resources
      - path: ../licenses/AnisetteKit-AGPL-3.0.txt
        buildPhase: resources
      - path: ../THIRD_PARTY.md
        buildPhase: resources
    dependencies:
      - package: AnisetteKit
    info:
      path: DirectSide/Info.plist
      properties:
        CFBundleDisplayName: DirectSide
        NSCameraUsageDescription: QR-Codes zum Hinzufügen deiner App-Quellen scannen.
        NSLocalNetworkUsageDescription: Apps über LocalDevVPN auf deinem eigenen Gerät installieren.
        NSBonjourServices: ['_remotepairing._tcp']
        LSApplicationQueriesSchemes: [livecontainer]
        CFBundleURLTypes:
          - CFBundleURLName: DirectSide Sources
            CFBundleURLSchemes: [directside]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.directside.app
        PRODUCT_NAME: DirectSide
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: DirectSide
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_OBJC_BRIDGING_HEADER: DirectSide/Bridge.h
        LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(PROJECT_DIR)/../target/aarch64-apple-ios/release']
        OTHER_LDFLAGS: ['$(inherited)', '-ldirectside_core', '-framework', Security, '-framework', SystemConfiguration, '-framework', CoreFoundation, '-liconv', '-lresolv']
  DirectSideAnisetteProbe:
    type: tool
    platform: macOS
    deploymentTarget: '13.0'
    sources:
      - DirectSide/LocalAnisette.swift
      - Tests/AnisetteProbe.swift
    dependencies:
      - package: AnisetteKit
    settings:
      base:
        PRODUCT_NAME: DirectSideAnisetteProbe
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  DirectSide:
    build:
      targets:
        DirectSide: all
  DirectSideAnisetteProbe:
    build:
      targets:
        DirectSideAnisetteProbe: all
