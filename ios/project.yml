name: DirectSide
options:
  bundleIdPrefix: com.directside
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
targets:
  DirectSide:
    type: application
    platform: iOS
    sources:
      - DirectSide
    info:
      path: DirectSide/Info.plist
      properties:
        CFBundleDisplayName: DirectSide
        NSCameraUsageDescription: QR-Codes zum Hinzufügen deiner App-Quellen scannen.
        NSLocalNetworkUsageDescription: Apps über LocalDevVPN auf deinem eigenen Gerät installieren.
        NSBonjourServices: ['_remotepairing._tcp']
        LSApplicationQueriesSchemes: [livecontainer]
        CFBundleURLTypes:
          - CFBundleURLName: DirectSide Sources
            CFBundleURLSchemes: [directside]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.directside.app
        PRODUCT_NAME: DirectSide
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: DirectSide
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_OBJC_BRIDGING_HEADER: DirectSide/Bridge.h
        LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(PROJECT_DIR)/../target/aarch64-apple-ios/release']
        OTHER_LDFLAGS: ['$(inherited)', '-ldirectside_core', '-framework', Security, '-framework', SystemConfiguration, '-framework', CoreFoundation, '-liconv', '-lresolv']
schemes:
  DirectSide:
    build:
      targets:
        DirectSide: all
