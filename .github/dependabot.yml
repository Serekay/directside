version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directories:
      - /
      - /vendor/mac-adi-rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
