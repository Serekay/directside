name: Build DirectSide
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios
      - name: Native signing core
        run: cargo +stable build --locked --release --lib --target aarch64-apple-ios
      - name: Source format tests
        run: |
          swiftc ios/DirectSide/Models.swift ios/Tests/main.swift -o /tmp/directside-source-tests
          /tmp/directside-source-tests
      - name: Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: iPhone application
        run: |
          xcodebuild -project ios/DirectSide.xcodeproj -scheme DirectSide -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/DirectSide.app package/Payload/
          cd package
          ditto -c -k --sequesterRsrc --keepParent Payload DirectSide.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DirectSide-iPhone-unsigned
          path: package/DirectSide.ipa
          retention-days: 7
