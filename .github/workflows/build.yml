name: Build DirectSide
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verified local Apple runtime
        run: |
          brew install sevenzip cmake pkgconf xcodegen
          python3 scripts/prepare-mac-runtime.py
          mkdir -p ios/Resources/MacAnisetteRuntime
          cp bin/apple/CoreADI.mac ios/Resources/MacAnisetteRuntime/
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios
      - name: Local Mac authentication interpreter (no JIT)
        run: python3 scripts/build-ios-mac-auth.py
      - name: Native signing core
        run: cargo +stable build --locked --release --lib --target aarch64-apple-ios
      - name: Source format tests
        run: |
          swiftc ios/DirectSide/Models.swift ios/Tests/main.swift -o /tmp/directside-source-tests
          /tmp/directside-source-tests
      - name: Xcode project
        run: |
          cd ios
          xcodegen generate
      - name: iPhone application
        run: |
          xcodebuild -project ios/DirectSide.xcodeproj -scheme DirectSide -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/DirectSide.app package/Payload/
          cd package
          ditto -c -k --sequesterRsrc --keepParent Payload DirectSide.ipa
      - name: Local interpreter provisioning probe
        run: |
          xcodebuild -project ios/DirectSide.xcodeproj -scheme DirectSideAnisetteProbe -configuration Release -destination 'platform=macOS' -derivedDataPath build-probe CODE_SIGNING_ALLOWED=NO build
          build-probe/Build/Products/Release/DirectSideAnisetteProbe "$PWD/ios/Resources/MacAnisetteRuntime"
      - uses: actions/upload-artifact@v4
        with:
          name: DirectSide-iPhone-unsigned
          path: package/DirectSide.ipa
          retention-days: 7
