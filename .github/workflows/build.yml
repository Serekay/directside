name: Build DirectSide
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directside-iphone-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  iphone:
    # Only manually selected, trusted default-branch code may use this build.
    if: github.repository == 'Serekay/directside' && github.ref == 'refs/heads/codex/initial-build' && github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan build history for secrets
        run: python3 scripts/scan-build-secrets.py
      - name: Check locked dependencies for known vulnerabilities
        run: python3 scripts/audit-rust-dependencies.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-registry-v2-${{ runner.arch }}-${{ hashFiles('scripts/build-ios-mac-auth.py', 'vendor/mac-adi-rust/**') }}
      - name: Verified local Apple runtime
        run: |
          brew install sevenzip cmake pkgconf xcodegen
          python3 scripts/prepare-mac-runtime.py
          mkdir -p ios/Resources/MacAnisetteRuntime
          cp bin/apple/CoreADI.mac ios/Resources/MacAnisetteRuntime/
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios
      - name: Local Mac authentication interpreter (no JIT)
        run: python3 scripts/build-ios-mac-auth.py
      - name: Source format tests
        run: |
          swiftc ios/DirectSide/Models.swift ios/DirectSide/Localization.swift ios/DirectSide/UpdateModel.swift ios/Tests/main.swift -o /tmp/directside-source-tests
          /tmp/directside-source-tests
          swiftc ios/DirectSide/SourceRefreshCoordinator.swift ios/Tests/SourceRefreshTests.swift -o /tmp/directside-refresh-tests
          /tmp/directside-refresh-tests
      - name: Xcode project
        run: |
          cd ios
          xcodegen generate
      - name: Local interpreter provisioning probe
        run: |
          xcodebuild -project ios/DirectSide.xcodeproj -scheme DirectSideAnisetteProbe -configuration Release -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath build-probe CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build
          build-probe/Build/Products/Release/DirectSideAnisetteProbe "$PWD/ios/Resources/MacAnisetteRuntime"
      - name: Native signing core
        run: cargo +stable build --locked --release --lib --target aarch64-apple-ios
      - name: iPhone application
        run: |
          xcodebuild -project ios/DirectSide.xcodeproj -scheme DirectSide -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/DirectSide.app package/Payload/
          cd package
          ditto -c -k --sequesterRsrc --keepParent Payload DirectSide.ipa
          python3 ../scripts/verify-directside-ipa.py DirectSide.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DirectSide-iPhone-unsigned
          path: package/DirectSide.ipa
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
