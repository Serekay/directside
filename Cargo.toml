[package]
name = "directside-engine"
version = "0.1.1"
edition = "2024"

[lib]
name = "directside_core"
crate-type = ["staticlib", "rlib"]

[features]
iphone-screenshots = ["idevice/dvt", "idevice/core_device_proxy"]
iphone-control = ["iphone-screenshots", "dep:ns-keyed-archive"]

[[example]]
name = "iphone-screenshot"
required-features = ["iphone-screenshots"]

[[example]]
name = "iphone-control"
required-features = ["iphone-control"]

[[example]]
name = "iphone-reset-setup"
required-features = ["iphone-screenshots"]

[dependencies]
ns-keyed-archive = { version = "0.1.5", optional = true }
isideload = { path = "vendor/isideload" }
idevice = { version = "0.1.61", default-features = false, features = ["usbmuxd", "ring", "tcp", "tunnel_tcp_stack", "house_arrest", "springboardservices", "amfi", "pair"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
rootcause = "0.12"
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
plist = "1.8"
apple-codesign-quick = "0.1.0"

[profile.release]
strip = true

[target.'cfg(windows)'.dependencies]
idevice = { version = "0.1.61", default-features = false, features = ["dvt", "core_device_proxy"] }
ns-keyed-archive = "0.1.5"

