[package]
name = "directside-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "directside_core"
crate-type = ["staticlib", "rlib"]

[features]
iphone-screenshots = ["idevice/dvt", "idevice/core_device_proxy"]

[[example]]
name = "iphone-screenshot"
required-features = ["iphone-screenshots"]

[dependencies]
isideload = { path = "vendor/isideload" }
idevice = { version = "0.1.61", default-features = false, features = ["usbmuxd", "ring", "tcp", "tunnel_tcp_stack", "house_arrest", "springboardservices", "amfi"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
rootcause = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
plist = "1.8"
apple-codesign-quick = "0.1.0"

[profile.release]
strip = true

